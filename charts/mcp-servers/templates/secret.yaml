{{- $existing := lookup "v1" "Secret" .Release.Namespace "mcp-server-tokens" }}
{{- $d := dict }}
{{- if $existing }}{{- $d = $existing.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: mcp-server-tokens
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
{{- range $name, $cfg := .Values.servers }}
{{- if $cfg.auth }}
{{- $key := printf "%s-token" $name }}
{{- $tok := randAlphaNum 32 }}
{{- if hasKey $d $key }}{{ $tok = index $d $key | b64dec }}{{ end }}
  {{ $key }}: {{ $tok | quote }}
{{- end }}
{{- end }}
