{{- if not .Values.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "platform-secrets" }}
{{- $d := dict }}
{{- if $existing }}{{- $d = $existing.data }}{{- end }}
{{- $pg := randAlphaNum 24 }}
{{- if hasKey $d "postgres-password" }}{{ $pg = index $d "postgres-password" | b64dec }}{{ end }}
{{- $enc := randAlphaNum 48 }}
{{- if hasKey $d "encryption-key" }}{{ $enc = index $d "encryption-key" | b64dec }}{{ end }}
{{- $sess := randAlphaNum 48 }}
{{- if hasKey $d "session-secret" }}{{ $sess = index $d "session-secret" | b64dec }}{{ end }}
{{- $adm := randAlphaNum 16 }}
{{- if hasKey $d "admin-password" }}{{ $adm = index $d "admin-password" | b64dec }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  postgres-password: {{ $pg | quote }}
  encryption-key: {{ $enc | quote }}
  session-secret: {{ $sess | quote }}
  admin-password: {{ $adm | quote }}
{{- end }}
