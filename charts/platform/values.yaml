persistence:
  storageClass: ""
  postgres: { size: 2Gi }

postgres:
  image: postgres:16-alpine
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: 500m, memory: 384Mi }

gateway:
