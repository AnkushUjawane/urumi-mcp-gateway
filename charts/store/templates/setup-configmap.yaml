apiVersion: v1
kind: ConfigMap
metadata:
  name: store-setup-scripts
data:
  setup.sh: |
    #!/bin/sh
    set -eu
    WP="wp --path=/var/www/html"

    echo "Waiting for wp-config.php..."
    until [ -f /var/www/html/wp-config.php ]; do sleep 3; done
    echo "Waiting for database..."
    until php /scripts/db-check.php; do sleep 3; done

    if ! $WP core is-installed; then
      echo "Installing WordPress..."
      $WP core install \
        --url="$WP_PUBLIC_URL" \
        --title="$STORE_TITLE" \
        --admin_user="$WP_ADMIN_USER" \
        --admin_password="$WP_ADMIN_PASSWORD" \
        --admin_email="$WP_ADMIN_EMAIL" \
        --skip-email
    fi

    $WP rewrite structure '/%postname%/' --hard
    $WP option update home "$WP_PUBLIC_URL"
    $WP option update siteurl "$WP_PUBLIC_URL"

    if ! $WP plugin is-installed woocommerce; then
      echo "Installing WooCommerce..."
      $WP plugin install woocommerce --version="$WOO_VERSION"
    fi
    $WP plugin activate woocommerce

    echo "Configuring WooCommerce..."
    $WP option update woocommerce_default_country "$STORE_COUNTRY"
    $WP option update woocommerce_currency "$STORE_CURRENCY"
    $WP option update woocommerce_ship_to_countries disabled
    $WP option update woocommerce_coming_soon no
    $WP option update woocommerce_store_pages_only no
    $WP option update woocommerce_cod_settings \
      '{"enabled":"yes","title":"Cash on delivery","description":"Pay with cash on delivery.","enable_for_methods":[],"enable_for_virtual":"yes"}' \
      --format=json
    $WP wc tool run install_pages --user="$WP_ADMIN_USER" || true

    echo "Registering REST API key..."
    $WP eval-file /scripts/create-api-key.php

    $WP rewrite flush --hard
    echo "Setup complete."
  create-api-key.php: |
    <?php
    global $wpdb;
    $table = $wpdb->prefix . 'woocommerce_api_keys';
    $ck = getenv('WOO_CONSUMER_KEY');
    $cs = getenv('WOO_CONSUMER_SECRET');
    if (!$ck || !$cs) { fwrite(STDERR, "missing key env\n"); exit(1); }
    $hash = hash_hmac('sha256', $ck, 'wc-api');
    $exists = $wpdb->get_var($wpdb->prepare("SELECT key_id FROM $table WHERE consumer_key = %s", $hash));
    if ($exists) { echo "API key already present\n"; return; }
    $user = get_user_by('login', getenv('WP_ADMIN_USER'));
    $wpdb->insert($table, [
      'user_id'         => $user->ID,
      'description'     => 'woo-mcp (generated by Helm)',
      'permissions'     => 'read_write',
      'consumer_key'    => $hash,
      'consumer_secret' => $cs,
      'truncated_key'   => substr($ck, -7),
    ]);
    echo "API key created\n";
  db-check.php: |
    <?php
    $h = explode(":", getenv("WORDPRESS_DB_HOST"));
    $m = @new mysqli($h[0], getenv("WORDPRESS_DB_USER"), getenv("WORDPRESS_DB_PASSWORD"), getenv("WORDPRESS_DB_NAME"), (int)$h[1]);
    exit($m->connect_errno ? 1 : 0);
