{{- if not .Values.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "store-secrets" }}
{{- $d := dict }}
{{- if $existing }}{{- $d = $existing.data }}{{- end }}
{{- $dbPass := randAlphaNum 24 }}
{{- if hasKey $d "db-password" }}{{ $dbPass = index $d "db-password" | b64dec }}{{ end }}
{{- $rootPass := randAlphaNum 24 }}
{{- if hasKey $d "db-root-password" }}{{ $rootPass = index $d "db-root-password" | b64dec }}{{ end }}
{{- $adminPass := randAlphaNum 20 }}
{{- if hasKey $d "wp-admin-password" }}{{ $adminPass = index $d "wp-admin-password" | b64dec }}{{ end }}
{{- $ck := printf "ck_%s" (randAlphaNum 40 | lower) }}
{{- if hasKey $d "woo-consumer-key" }}{{ $ck = index $d "woo-consumer-key" | b64dec }}{{ end }}
{{- $cs := printf "cs_%s" (randAlphaNum 40 | lower) }}
{{- if hasKey $d "woo-consumer-secret" }}{{ $cs = index $d "woo-consumer-secret" | b64dec }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: store-secrets
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  db-password: {{ $dbPass | quote }}
  db-root-password: {{ $rootPass | quote }}
  wp-admin-password: {{ $adminPass | quote }}
  woo-consumer-key: {{ $ck | quote }}
  woo-consumer-secret: {{ $cs | quote }}
{{- end }}
