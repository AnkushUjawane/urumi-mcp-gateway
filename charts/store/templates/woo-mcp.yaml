apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
spec:
  type: ClusterIP            # internal only: no Ingress exists for this
  selector: { app: woo-mcp }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp
spec:
  replicas: 1
  selector:
    matchLabels: { app: woo-mcp }
  template:
    metadata:
      labels: { app: woo-mcp }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: woo-mcp
          image: "{{ .Values.wooMcp.image.repository }}:{{ .Values.wooMcp.image.tag }}"
          imagePullPolicy: {{ .Values.wooMcp.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: WOO_BASE_URL
              value: http://wordpress
            - name: WOO_PUBLIC_HOST
              value: {{ .Values.ingress.host | quote }}
            - name: WOO_CONSUMER_KEY
              valueFrom: { secretKeyRef: { name: {{ include "store.secretName" . }}, key: woo-consumer-key } }
            - name: WOO_CONSUMER_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "store.secretName" . }}, key: woo-consumer-secret } }
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.wooMcp.resources | nindent 12 }}
