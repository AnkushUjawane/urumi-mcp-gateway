# Default deny: nothing can reach any pod in this namespace unless a rule below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# WordPress: the ingress controller (storefront) and pods in this namespace (woo-mcp, setup job)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-wordpress }
spec:
  podSelector: { matchLabels: { app: wordpress } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
        - podSelector: {}
---
# MariaDB: only pods in this namespace (WordPress, setup job)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-mariadb }
spec:
  podSelector: { matchLabels: { app: mariadb } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
# woo-mcp: ONLY the gateway pods in the platform namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-woo-mcp-from-gateway }
spec:
  podSelector: { matchLabels: { app: woo-mcp } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: platform } }
          podSelector: { matchLabels: { app: gateway } }
